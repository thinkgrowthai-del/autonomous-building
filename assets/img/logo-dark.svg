<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Autonomous Building">
  <!-- Refreshed logo, navy-on-light variant: gold mark, navy wordmark. For white/light backgrounds. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2B02A"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="url(#gold)">
    <polygon points="10,60 36,54 36,112 10,112"/>
    <polygon points="42,22 54,18 54,112 42,112"/>
    <polygon points="59,32 71,36 71,112 59,112"/>
    <polygon points="76,74 98,68 98,112 76,112"/>
  </g>
  <path d="M2 120 Q54 108 106 120" fill="none" stroke="url(#arc)" stroke-width="2.5"/>
  <text x="126" y="74" fill="#0A1F5C" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-weight="700" font-size="42" letter-spacing="3">AUTONOMOUS</text>
  <text x="128" y="108" fill="#B8860B" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-weight="600" font-size="21" letter-spacing="13.5">BUILDING</text>
</svg>
